[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "imgedge"
version = "0.2.0"
description = "Local image-classifier backend for the ImgEdge MV3 extension."
authors = [{ name = "Matthew Bedford" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
dependencies = ["numpy==2.5.0", "pillow==12.2.0", "ai-edge-litert==2.1.5"]

[project.optional-dependencies]
voters = ["timm==1.0.27", "torch==2.12.1"]
onnx = ["onnxruntime==1.27.0"]
dev = ["pytest==9.1.1", "ruff==0.15.20", "pip-audit==2.10.1", "pre-commit==4.6.0", "pytest-codspeed==5.0.3", "pytest-cov==7.1.0"]

[project.scripts]
imgedge-server = "imgedge.classifier.server:main"
imgedge-download-models = "imgedge.inat.download_models:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["training", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
# These are loose, in-place modules (no package), so tell isort they're ours to
# keep the stdlib / third-party / local import grouping the code already uses.
known-first-party = ["imgedge"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]  # tests wire sys.path (in conftest) before importing modules

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "perf: performance-regression guards (run via the CI 'perf' job; not in the default gate)",
]
