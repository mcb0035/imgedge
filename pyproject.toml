[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imgedge"
version = "0.5.0"
description = "Local image-classifier backend for the ImgEdge MV3 extension."
authors = [{ name = "Matthew Bedford" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
dependencies = ["numpy==2.5.1", "pillow==12.3.0", "ai-edge-litert==2.1.6"]

[project.optional-dependencies]
voters = ["timm==1.0.28", "torch==2.13.0"]
onnx = ["onnxruntime==1.27.0"]
eval = ["pyzipper==0.4.0"]
siglip = ["transformers==5.13.1", "sentencepiece==0.2.2"]
mobileclip = ["open_clip_torch==3.3.0"]
dev = ["pytest==9.1.1", "ruff==0.15.21", "pip-audit==2.10.1", "pre-commit==4.6.0", "pytest-codspeed==5.0.3", "pytest-cov==7.1.0"]

[project.scripts]
imgedge-server = "imgedge.classifier.server:main"
imgedge-download-models = "imgedge.inat.download_models:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["training", "dist", "fuzz"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
# These are loose, in-place modules (no package), so tell isort they're ours to
# keep the stdlib / third-party / local import grouping the code already uses.
known-first-party = ["imgedge"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]  # tests wire sys.path (in conftest) before importing modules

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Treat any Python warning as an error so deprecations / resource leaks fail the
# suite instead of accumulating. Add "ignore::DeprecationWarning:<module>" entries
# only for unfixable third-party noise.
filterwarnings = ["error"]
markers = [
    "perf: performance-regression guards (run via the CI 'perf' job; not in the default gate)",
]

[tool.coverage.run]
# The coverage gate runs in the core CI job, which installs only the base
# dependencies (no optional voters / ONNX), has no downloaded model artifacts,
# and runs on Linux. Scope coverage to the deterministic, always-on core so the
# percentage is stable across environments. The omitted modules are covered
# elsewhere (the Windows test job, or an install with the optional extras) or
# require model files / extra packages the gate intentionally does not provide.
omit = [
    # Windows-only decode sandbox (exercised by the Windows test job)
    "*/imgedge/classifier/appcontainer.py",
    "*/imgedge/classifier/confine.py",
    "*/imgedge/classifier/ac_pool.py",
    # Opt-in out-of-process decode pool: worker-subprocess orchestration is
    # integration-level (the fast unit gate never spawns workers); its testable
    # surface is covered by tests/test_decode_pool.py.
    "*/imgedge/classifier/decode_pool.py",
    # Optional backends / offline tools (extra deps not installed in the gate)
    "*/imgedge/voters/timm_voter.py",
    "*/imgedge/voters/siglip_voter.py",
    "*/imgedge/voters/mobileclip_voter.py",
    "*/imgedge/inat/onnx_filter.py",
    "*/imgedge/inat/convert_to_onnx.py",
    # Require downloaded model artifacts (not present in CI)
    "*/imgedge/inat/inat_filter.py",
    "*/imgedge/inat/inat_vision.py",
    "*/imgedge/inat/download_models.py",
    "*/imgedge/voters/inat_voter.py",
]
