<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ImgEdge</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 12px 14px;
        font: 13px/1.4 system-ui, "Segoe UI", sans-serif;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 15px;
      }
      .counts {
        margin: 0 0 4px;
        color: #555;
        font-size: 12px;
      }
      .health {
        margin: 0 0 10px;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
        color: #777;
      }
      .health::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #bbb;
        flex: none;
      }
      .health.ok { color: #2e7d32; }
      .health.ok::before { background: #2e7d32; }
      .health.warn { color: #b8860b; }
      .health.warn::before { background: #b8860b; }
      .health.bad { color: #c0392b; }
      .health.bad::before { background: #c0392b; }
      h2 {
        margin: 14px 0 6px;
        font-size: 13px;
        font-weight: 600;
      }
      label.row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
      }
      label.field {
        display: block;
        margin: 8px 0;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        box-sizing: border-box;
        padding: 4px 6px;
        margin-top: 3px;
      }
      input[type="range"] {
        width: 100%;
        margin: 4px 0 2px;
      }
      .sliderval {
        color: #777;
        font-variant-numeric: tabular-nums;
      }
      .sliderhint {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: #888;
      }
      .presets {
        display: flex;
        gap: 6px;
        margin: 6px 0 2px;
      }
      .preset {
        flex: 1;
        display: flex;
        align-items: flex-start;
        gap: 5px;
        padding: 6px 7px;
        border: 1px solid #8886;
        border-radius: 6px;
        cursor: pointer;
      }
      .preset:has(input:checked) {
        border-color: #2e7d32;
        background: #2e7d3214;
      }
      .preset:has(input:disabled) {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .preset input {
        margin: 2px 0 0;
      }
      .preset-body {
        display: flex;
        flex-direction: column;
        line-height: 1.25;
      }
      .preset-body small {
        color: #888;
        font-size: 10.5px;
      }
      .presethint {
        margin: 4px 0 2px;
        font-size: 11px;
        color: #b8860b;
      }
      .presethint:empty {
        display: none;
      }
      details.advanced {
        margin: 10px 0 2px;
      }
      details.advanced > summary {
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
        margin: 4px 0;
      }
      button {
        cursor: pointer;
        padding: 4px 10px;
      }
      #save {
        margin-top: 8px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 160px;
        overflow: auto;
        border: 1px solid #8884;
        border-radius: 4px;
      }
      li {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px;
        border-bottom: 1px solid #8882;
      }
      li:last-child {
        border-bottom: 0;
      }
      li.empty {
        color: #888;
        justify-content: center;
      }
      .url {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
      }
      li button {
        padding: 2px 6px;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <h1>ImgEdge</h1>

    <div id="counts" class="counts">Allowed 0 &middot; Blocked 0</div>
    <div id="health" class="health">Classifier: checking&hellip;</div>

    <label class="row">
      <input type="checkbox" id="enabled" />
      Filtering enabled
    </label>

    <h2>Detection mode</h2>
    <div id="presets" class="presets">
      <label class="preset">
        <input type="radio" name="profile" value="fast" />
        <span class="preset-body"><b>Fast</b><small>Fastest &middot; 2 models</small></span>
      </label>
      <label class="preset">
        <input type="radio" name="profile" value="balanced" />
        <span class="preset-body"><b>Balanced</b><small>+ MobileCLIP</small></span>
      </label>
      <label class="preset">
        <input type="radio" name="profile" value="accurate" />
        <span class="preset-body"><b>Accurate</b><small>Most thorough</small></span>
      </label>
    </div>
    <p id="presethint" class="presethint"></p>

    <details id="advanced" class="advanced">
      <summary>Advanced</summary>

      <label class="field">
        Classifier endpoint
        <input type="text" id="endpoint" placeholder="http://localhost:8723/classify" />
      </label>

      <label class="field">
        Server token
        <input type="password" id="token" placeholder="paste from the server console" />
      </label>

      <label class="row">
        <input type="checkbox" id="showToken" />
        Show token
      </label>

      <label class="row">
        <input type="checkbox" id="sendData" />
        Send image bytes (base64) too
      </label>

      <label class="row">
        <input type="checkbox" id="failClosed" />
        Block when classifier is unreachable
      </label>

      <label class="row">
        <input type="checkbox" id="strict" />
        Strict mode (block until classifier allows)
      </label>

      <label class="row">
        <input type="checkbox" id="scanBackgrounds" />
        Scan CSS background images
      </label>

      <h2>Tuning</h2>

      <label class="field">
        Block threshold <span id="thresholdVal" class="sliderval"></span>
        <input type="range" id="threshold" min="0.05" max="0.95" step="0.01" value="0.18" />
        <span class="sliderhint"><span>Block more</span><span>Block less</span></span>
      </label>

      <label class="field">
        Salience (size/detail) weighting <span id="salienceVal" class="sliderval"></span>
        <input type="range" id="salience" min="0" max="1" step="0.1" />
        <span class="sliderhint"><span>Block more</span><span>Block less</span></span>
      </label>

      <button id="save">Save settings</button>
    </details>

    <h2>Whitelisted images</h2>
    <ul id="whitelist"></ul>

    <h2>Allowed sites</h2>
    <ul id="domains"></ul>

    <h2>Blocked images</h2>
    <ul id="blocklist"></ul>

    <script src="popup.js"></script>
  </body>
</html>
