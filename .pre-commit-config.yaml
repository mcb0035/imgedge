# Local hooks for ImgEdge. Set up with:
#   pip install pre-commit && pre-commit install
#   npm install                     # for the eslint hook
# Update pinned hook versions later with:  pre-commit autoupdate
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: eslint
        name: eslint (extension JS)
        entry: npx eslint
        language: system
        files: \.js$
      - id: sync-version
        name: sync version (pyproject -> manifest.json / package.json)
        entry: python tools/sync_version.py
        language: system
        files: ^(pyproject\.toml|manifest\.json|package\.json|src/imgedge/__init__\.py)$
        pass_filenames: false
