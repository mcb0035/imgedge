name: DCO

# Enforces the Developer Certificate of Origin: every non-merge commit in a pull
# request must carry a `Signed-off-by:` trailer matching its author (git commit -s).
# Trusted automation bots (allow-listed below, e.g. Dependabot) are exempt.
# See CONTRIBUTING.md#developer-certificate-of-origin-dco.

on: pull_request

permissions:
  contents: read

jobs:
  dco:
    name: Sign-off check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need the full base..head commit range
      - name: Every commit must be signed off by its author
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Author names allow-listed as trusted bots: they can't add a DCO
          # sign-off and their commits are mechanical dependency bumps. GitHub bot
          # logins end in "[bot]" and can't be a human username, so this is
          # spoof-proof. Add more entries here if the project adopts other bots.
          BOT_AUTHORS=("dependabot[bot]")
          fail=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            name="$(git show -s --format='%an' "$sha")"
            author="$(git show -s --format='%an <%ae>' "$sha")"
            skip=0
            for bot in "${BOT_AUTHORS[@]}"; do
              if [ "$name" = "$bot" ]; then skip=1; break; fi
            done
            if [ "$skip" -eq 1 ]; then continue; fi
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" \
                 | grep -qxF "$author"; then
              subject="$(git show -s --format='%s' "$sha")"
              echo "::error::Commit $sha is not signed off by its author ($author): $subject"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more commits lack a matching 'Signed-off-by' (DCO). Fix with 'git commit --amend -s' (last commit) or 'git rebase --signoff $BASE_SHA' (a series), then force-push. See CONTRIBUTING.md#developer-certificate-of-origin-dco"
            exit 1
          fi
          echo "All non-merge commits are signed off by their authors."
