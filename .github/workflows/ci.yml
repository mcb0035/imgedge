name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python (lint + compile + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip ruff pytest numpy pillow
      - name: Lint (ruff)
        run: ruff check .
      - name: Compile
        run: python -m py_compile classifier/server.py inat/*.py voters/*.py
      - name: Tests
        run: pytest

  javascript:
    name: Extension JS (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Lint (eslint)
        run: npx eslint .

  security:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pip-audit
      - name: Audit required runtime (gating)
        run: pip-audit --requirement inat/requirements.lock
      - name: Audit optional voters (report-only)
        run: pip-audit --requirement voters/requirements.lock
        continue-on-error: true
