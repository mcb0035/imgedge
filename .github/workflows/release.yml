name: Release

# Tag a release with e.g. `git tag v0.3.0 && git push origin v0.3.0`.
# This verifies the tag matches the manifest version, builds the store ZIP (and a
# self-hosted .crx when a signing key is configured), signs the artifacts (a SLSA
# build-provenance attestation plus a keyless Sigstore signature over SHA256SUMS),
# and publishes a GitHub Release. The optional store-publish jobs upload to the
# Chrome Web Store / Edge Add-ons when their repo variable + secrets are set (see
# docs/development.md#versioning--releases); until then they are skipped.
on:
  push:
    tags: ["v*"]

# Least privilege at the top level; each job elevates only what it needs.
permissions:
  contents: read

jobs:
  release:
    name: Package, sign + GitHub Release
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    permissions:
      contents: write # create the GitHub Release and upload the assets
      id-token: write # keyless signing: provenance attestation + cosign (OIDC)
      attestations: write # record the provenance attestation
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify tag matches manifest version
        shell: pwsh
        run: |
          $ver = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          if ($ver -ne $tag) {
            throw "Tag v$tag does not match manifest version $ver"
          }
          Write-Host "Releasing v$ver"

      - name: Build extension package (+ signed .crx when a key is configured)
        shell: pwsh
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if ($env:CRX_PRIVATE_KEY) {
            New-Item -ItemType Directory dist -Force | Out-Null
            [IO.File]::WriteAllBytes("$PWD/dist/imgedge.pem", [Convert]::FromBase64String($env:CRX_PRIVATE_KEY))
            ./package.ps1 -Crx
            Remove-Item dist/imgedge.pem -Force   # never ship or cache the private key
          } else {
            ./package.ps1
            Write-Host "CRX_PRIVATE_KEY not set -> building the store ZIP only (no .crx)."
          }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.zip', '.crx' } | Sort-Object Name
          if (-not $files) { throw "No artifacts found in dist/ to checksum." }
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content dist/SHA256SUMS -Encoding ascii
          Get-Content dist/SHA256SUMS

      - name: Export artifact digests for SLSA provenance
        id: hashes
        shell: pwsh
        run: |
          # base64(sha256sum-format lines) consumed by the SLSA generic generator.
          # Get-Content (no -Raw) strips line endings; re-join with LF so the
          # decoded subjects are clean "<sha256>  <name>" lines.
          $lines = (Get-Content dist/SHA256SUMS) -join "`n"
          $b64 = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($lines))
          "hashes=$b64" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums (keyless Sigstore)
        shell: pwsh
        # Also emit a detached .sig + .pem next to the bundle: OpenSSF Scorecard's
        # Signed-Releases check name-matches release assets (*.sig, *.asc, *.sigstore,
        # *.intoto.jsonl, ...) and does not recognize *.cosign.bundle, so without a
        # recognized asset it reports the release as "not signed".
        run: >
          cosign sign-blob --yes
          --bundle dist/SHA256SUMS.cosign.bundle
          --output-signature dist/SHA256SUMS.sig
          --output-certificate dist/SHA256SUMS.pem
          dist/SHA256SUMS

      - name: Verify the signature (self-check)
        # Fail the release before it attests/publishes if the bundle doesn't
        # verify against this workflow's own OIDC identity.
        shell: pwsh
        run: >
          cosign verify-blob
          --bundle dist/SHA256SUMS.cosign.bundle
          --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}"
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          dist/SHA256SUMS

      - name: Attest build provenance (ZIP)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/imgedge-*.zip

      - name: Attest build provenance (CRX)
        if: ${{ hashFiles('dist/*.crx') != '' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*.crx

      - name: Upload the ZIP for the store-publish jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-zip
          path: dist/imgedge-*.zip
          if-no-files-found: error
          retention-days: 5

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            dist/imgedge-*.zip
            dist/*.crx
            dist/SHA256SUMS
            dist/SHA256SUMS.cosign.bundle
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.pem
          generate_release_notes: true

  provenance:
    name: SLSA provenance (release asset)
    needs: release
    permissions:
      actions: read # read the workflow path for the provenance statement
      id-token: write # keyless signing of the provenance
      contents: write # attach the .intoto.jsonl to the release
    # The SLSA generic generator emits a signed <artifact>.intoto.jsonl and
    # uploads it to the release, which OpenSSF Scorecard's Signed-Releases check
    # recognizes as provenance. Pin to a semantic version tag: the generator
    # rejects SHA refs by design, and Scorecard's pinned-deps check exempts it.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: true

  # ---- Optional store publishing --------------------------------------------
  # Dormant until you opt in: set repo variable PUBLISH_CHROME / PUBLISH_EDGE to
  # "true" AND add the matching secrets. See docs/development.md#versioning--releases.
  chrome-web-store:
    name: Publish to Chrome Web Store
    needs: release
    if: ${{ vars.PUBLISH_CHROME == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # download the workflow artifact from this run
    steps:
      - name: Download the built ZIP
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-zip
          path: dist
      - name: Resolve ZIP path
        id: zip
        run: echo "path=$(ls dist/*.zip)" >> "$GITHUB_OUTPUT"
      - name: Upload + publish
        uses: mnao305/chrome-extension-upload@fdfe79400af990f5145a319e834aee64907ccff4 # v6.0.0
        with:
          file-path: ${{ steps.zip.outputs.path }}
          extension-id: ${{ secrets.CWS_EXTENSION_ID }}
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}

  edge-addons:
    name: Publish to Edge Add-ons
    needs: release
    if: ${{ vars.PUBLISH_EDGE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # download the workflow artifact from this run
    steps:
      - name: Download the built ZIP
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-zip
          path: dist
      - name: Resolve ZIP path
        id: zip
        run: echo "path=$(ls dist/*.zip)" >> "$GITHUB_OUTPUT"
      - name: Publish
        uses: wdzeng/edge-addon@9881f57720358040d079eaa06a4596dc9c273eb6 # v2.1.1
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          zip-path: ${{ steps.zip.outputs.path }}
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_API_KEY }}
